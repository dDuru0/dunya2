<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dünya Partisi - Turnuva Gecesi</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg1:#030712;--bg2:#0f172a;--ink:#f8fafc;--mute:#94a3b8;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 50% 0%,var(--bg2),var(--bg1) 80%) fixed;overflow-x:hidden}
main{max-width:1150px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:clamp(26px,5vw,42px);margin:6px 0 4px;text-align:center;font-weight:900;letter-spacing:-0.5px;background:linear-gradient(135deg,#60a5fa,#e879f9,#facc15);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 40px rgba(96,165,250,.3)}
.sub{text-align:center;color:var(--mute);margin:0 0 20px;font-size:15px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;max-width:500px;margin:20px auto;backdrop-filter:blur(16px);box-shadow:0 20px 40px rgba(0,0,0,.4)}
.panel h2{margin:0 0 14px;font-size:20px;text-align:center;font-weight:700}
input{width:100%;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.4);color:var(--ink);padding:14px;font:inherit;font-size:17px;margin-bottom:12px;text-align:center;transition:border-color .2s}
input:focus{outline:none;border-color:#60a5fa;box-shadow:0 0 15px rgba(96,165,250,.3)}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:14px 26px;cursor:pointer;color:#0f172a;background:linear-gradient(135deg,#38bdf8,#818cf8);box-shadow:0 8px 25px rgba(56,189,248,.3);transition:transform .15s,filter .15s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
button:disabled{opacity:.35;cursor:not-allowed;transform:none;filter:none}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.hide{display:none!important}
.msg{text-align:center;color:#f87171;margin:10px 0;font-weight:600}

.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;max-width:600px;margin:40px auto}
.choice{display:flex;flex-direction:column;align-items:center;gap:10px;padding:32px 20px;border-radius:24px;color:var(--ink);background:var(--card);border:2px solid var(--line);cursor:pointer;transition:all .3s;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.choice span{font-size:52px}
.choice small{font-weight:400;font-size:13px;color:var(--mute)}
.choice:hover{border-color:#38bdf8;box-shadow:0 0 35px rgba(56,189,248,.35);transform:translateY(-4px)}

.code{font-size:clamp(40px,10vw,72px);letter-spacing:.25em;font-weight:900;text-align:center;color:#facc15;text-shadow:0 0 25px rgba(250,204,21,.4);margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0;min-height:35px}
.chip{padding:6px 14px;border-radius:999
